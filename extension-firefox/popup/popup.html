<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stock-Hub Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Stock-Hub Sync</strong>
    <div class="header-actions">
      <button id="openTabButton" class="icon-button" title="Buka di Tab Sendiri" aria-label="Buka di Tab Sendiri">⤢</button>
      <button id="settingsButton" class="icon-button" title="Pengaturan" aria-label="Pengaturan">⚙</button>
    </div>
  </header>

  <main>
    <section id="settingsView" class="view">
      <h1>Pengaturan</h1>
      <p class="hint">Masukkan kredensial Stock-Hub yang biasa dipakai di dashboard.</p>
      <label for="stockhubUrl">URL Stock-Hub</label>
      <input id="stockhubUrl" type="url" placeholder="https://stock-hub.vercel.app">
      <label for="stockhubUser">Username</label>
      <input id="stockhubUser" type="text" autocomplete="username">
      <label for="stockhubKey">Access Key</label>
      <input id="stockhubKey" type="password" autocomplete="current-password">
      <button id="saveButton" class="primary">Simpan dan Tes Koneksi</button>
      <div id="settingsStatus" class="status" role="status"></div>
    </section>

    <section id="syncView" class="view hidden">
      <div class="marketplaces">
        <label><input id="shopeeEnabled" type="checkbox" checked> Shopee</label>
        <label><input id="tokopediaEnabled" type="checkbox" checked> Tokopedia</label>
      </div>
      <button id="syncButton" class="primary sync-button">🔄 Sync Stock</button>
      <div id="progressWrapper" class="progress-wrapper hidden">
        <div class="progress-header">
          <span id="progressStep">Menyiapkan...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
      <div id="progress" class="progress" role="log" aria-live="polite"></div>
      <section class="schedule-section">
        <h2>Sync Terjadwal</h2>
        <label class="schedule-toggle"><input id="scheduleEnabled" type="checkbox"> Aktif</label>
        <label class="schedule-toggle"><input id="scheduleCatchUp" type="checkbox"> Jalankan jika jadwal terlewat</label>
        <label for="scheduleTime">Jam lokal</label>
        <input id="scheduleTime" type="text" inputmode="numeric" pattern="([01]\d|2[0-3]):[0-5]\d" maxlength="5" placeholder="HH:mm" value="08:00" aria-describedby="scheduleHint">
        <div id="scheduleHint" class="field-hint">Format 24 jam, contoh 08:45</div>
        <button id="saveScheduleButton" class="secondary">Simpan jadwal</button>
        <div id="scheduleStatus" class="status" role="status"></div>
      </section>
      <section class="history-section">
        <h2>Riwayat Terakhir</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </section>
  </main>
  <script src="../lib/settings.js" type="module"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
